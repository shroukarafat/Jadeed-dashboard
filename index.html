<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>JADEEDTEAM - Task Dashboard</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f3f7f7;
    color:#1f2937;
    -webkit-text-size-adjust:100%;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#0b3839,#176b68);
    color:#fff;
    padding:15px 16px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.header-content{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.company-logo{
    width:52px;
    height:52px;
    min-width:52px;
    max-width:52px;
    min-height:52px;
    max-height:52px;
    display:block;
    object-fit:contain;
    background:#fff;
    border-radius:10px;
    padding:4px;
    flex-shrink:0;
}

.brand-text{
    min-width:0;
}

.brand-text h1{
    margin:0;
    font-size:23px;
    line-height:1.2;
    letter-spacing:.6px;
}

.subtitle{
    margin:3px 0;
    font-size:12px;
    opacity:.9;
}

.follow-up{
    margin:0;
    font-size:10px;
    opacity:.8;
}

.live-status{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.14);
    padding:7px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:700;
    flex-shrink:0;
}

.live-dot{
    width:7px;
    height:7px;
    background:#4ade80;
    border-radius:50%;
}


/* ================= MAIN ================= */

.container{
    width:100%;
    max-width:1100px;
    margin:18px auto;
    padding:0 14px;
}


/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat-card{
    background:#fff;
    border:1px solid #e3eeee;
    border-radius:12px;
    padding:13px;
    box-shadow:0 3px 10px rgba(0,0,0,.04);
}

.stat-title{
    font-size:11px;
    color:#6b7280;
}

.stat-number{
    font-size:24px;
    font-weight:700;
    margin-top:3px;
}


/* ================= CARD ================= */

.card{
    background:#fff;
    border-radius:14px;
    border:1px solid #e4eeee;
    box-shadow:0 3px 14px rgba(0,0,0,.05);
    margin-bottom:15px;
    overflow:hidden;
}

.card-header{
    padding:15px 17px;
    border-bottom:1px solid #edf1f1;
}

.card-header h2{
    margin:0;
    font-size:16px;
    color:#123f40;
}

.card-header p{
    margin:4px 0 0;
    font-size:11px;
    color:#7b8585;
}


/* ================= FORM ================= */

.form-container{
    padding:15px;
    display:grid;
    grid-template-columns:1fr 1.5fr 1fr auto;
    gap:8px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #d6e0e0;
    border-radius:8px;
    padding:10px 11px;
    font-family:inherit;
    font-size:13px;
    outline:none;
    background:#fff;
    color:#1f2937;
}

textarea{
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#176b68;
}

.add-btn{
    background:#176b68;
    color:#fff;
    border:0;
    border-radius:8px;
    padding:10px 18px;
    font-weight:700;
    cursor:pointer;
    font-size:13px;
}

.add-btn:active{
    transform:scale(.98);
}


/* ================= TOOLBAR ================= */

.toolbar{
    padding:12px 15px;
    display:flex;
    gap:8px;
    border-bottom:1px solid #edf1f1;
}

.search-box{
    flex:1;
}

.filter{
    width:145px;
}


/* ================= TASKS ================= */

.tasks-container{
    padding:12px;
}

.task-card{
    background:#fff;
    border:1px solid #e1eaea;
    border-left:5px solid #f59e0b;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.04);
}

.pending-card{
    background:#fffdfa;
    border-left-color:#f59e0b;
}

.completed-card{
    background:#f2fcf6;
    border-left-color:#16a34a;
}


/* ================= TASK TOP ================= */

.task-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
}

.task-name{
    font-size:16px;
    font-weight:700;
    line-height:1.4;
    color:#123f40;
    word-break:break-word;
}

.completed-card .task-name{
    color:#166534;
}


/* ================= STATUS ================= */

.status{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 9px;
    border-radius:15px;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
}

.status.pending{
    background:#fff0d9;
    color:#c2410c;
}

.status.completed{
    background:#dcfce7;
    color:#15803d;
}

.status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:currentColor;
}


/* ================= INFO ================= */

.task-info{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:8px;
}

.info-box{
    background:#f7fafb;
    border-radius:8px;
    padding:9px;
}

.completed-card .info-box{
    background:#e8f8ee;
}

.info-title{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:#7b8585;
    font-weight:700;
    margin-bottom:3px;
}

.info-text{
    font-size:13px;
    line-height:1.5;
    color:#374151;
    word-break:break-word;
}


/* ================= COMMENT ================= */

.comment-area{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #e8eeee;
}

.comment-title{
    font-size:11px;
    font-weight:700;
    color:#374151;
    margin-bottom:5px;
}

.comment-input{
    width:100%;
    min-height:42px;
    height:42px;
    max-height:160px;
    resize:vertical;
    padding:9px 10px;
    font-size:12px;
    line-height:1.5;
}


/* ================= ACTIONS ================= */

.task-actions{
    display:flex;
    gap:7px;
    margin-top:9px;
}

.action-btn{
    border:0;
    border-radius:7px;
    padding:9px 11px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.done-btn{
    background:#176b68;
    color:white;
}

.comment-btn{
    background:#e0f2fe;
    color:#0369a1;
}

.delete-btn{
    background:#fee2e2;
    color:#b91c1c;
}

.action-btn:active{
    transform:scale(.98);
}


/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:45px 15px;
    color:#9ca3af;
}

.empty-icon{
    font-size:35px;
}

.empty h3{
    margin:7px 0;
    color:#4b5563;
    font-size:16px;
}


/* ================= MESSAGE ================= */

#message{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;
    z-index:9999;
    display:none;
    padding:11px 15px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

#message.success{
    background:#dcfce7;
    color:#166534;
}

#message.error{
    background:#fee2e2;
    color:#991b1b;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        padding:12px 10px;
    }

    .header-content{
        width:100%;
    }

    .company-logo{
        width:46px !important;
        height:46px !important;
        min-width:46px !important;
        max-width:46px !important;
        min-height:46px !important;
        max-height:46px !important;
        display:block !important;
    }

    .brand{
        gap:8px;
    }

    .brand-text h1{
        font-size:18px;
    }

    .subtitle{
        font-size:9px;
    }

    .follow-up{
        font-size:8px;
    }

    .live-status{
        padding:6px 8px;
        font-size:9px;
    }

    .container{
        margin:12px auto;
        padding:0 8px;
    }

    .stats{
        gap:6px;
    }

    .stat-card{
        padding:10px 8px;
    }

    .stat-title{
        font-size:9px;
    }

    .stat-number{
        font-size:20px;
    }

    .form-container{
        grid-template-columns:1fr;
        padding:12px;
    }

    .add-btn{
        width:100%;
        min-height:42px;
    }

    .toolbar{
        flex-direction:column;
        padding:11px;
    }

    .filter{
        width:100%;
    }

    .tasks-container{
        padding:8px;
    }

    .task-card{
        padding:12px;
        margin-bottom:9px;
        border-radius:11px;
    }

    .task-top{
        display:block;
    }

    .task-name{
        font-size:15px;
        margin-bottom:7px;
    }

    .task-info{
        grid-template-columns:1fr;
        gap:6px;
    }

    .info-text{
        font-size:12px;
    }

    .comment-input{
        min-height:42px;
        height:42px;
    }

    .task-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .action-btn{
        width:100%;
        min-height:40px;
    }

    .delete-btn{
        grid-column:1 / -1;
    }
}


/* ================= VERY SMALL PHONES ================= */

@media(max-width:380px){

    .company-logo{
        width:42px !important;
        height:42px !important;
        min-width:42px !important;
        max-width:42px !important;
        min-height:42px !important;
        max-height:42px !important;
    }

    .brand-text h1{
        font-size:16px;
    }

    .subtitle{
        font-size:8px;
    }

    .follow-up{
        font-size:7px;
    }

    .live-status{
        padding:5px 6px;
        font-size:8px;
    }

}

</style>

</head>

<body>

<header class="header">

<div class="header-content">

<div class="brand">

<img
src="Logo.png"
alt="JADEED Climate Technology"
class="company-logo"
onerror="this.style.display='none';"

>

<div class="brand-text">

<h1>JADEEDTEAM</h1>

<p class="subtitle">
Task Management & Follow-up
</p>

<p class="follow-up">
Follow-up by
<strong>Shrouk</strong>
&
<strong>Mr. Ahmed</strong>
</p>

</div>

</div>

<div class="live-status">

<span class="live-dot"></span>

Live

</div>

</div>

</header>

<main class="container">

<!-- STATS -->

<div class="stats">

<div class="stat-card">

<div class="stat-title">
Total Tasks
</div>

<div
class="stat-number"
id="totalTasks">
0
</div>

</div>

<div class="stat-card">

<div class="stat-title">
Pending
</div>

<div
class="stat-number"
id="pendingTasks">
0
</div>

</div>

<div class="stat-card">

<div class="stat-title">
Completed
</div>

<div
class="stat-number"
id="completedTasks">
0
</div>

</div>

</div>

<!-- ADD TASK -->

<div class="card">

<div class="card-header">

<h2>
Add New Task
</h2>

<p>
Create a task and assign it to a team member
</p>

</div>

<div class="form-container">

<input
type="text"
id="taskName"
placeholder="Task Name"
autocomplete="off"

>

<input
type="text"
id="taskDesc"
placeholder="Description"
autocomplete="off"

>

<input
type="text"
id="taskAssignee"
placeholder="Assignee"
autocomplete="off"

>

<button
type="button"
class="add-btn"
id="addTaskButton"

>

＋ Add Task </button>

</div>

</div>

<!-- TASK LIST -->

<div class="card">

<div class="toolbar">

<input
type="search"
id="searchInput"
class="search-box"
placeholder="🔎 Search tasks..."
autocomplete="off"

>

<select
id="statusFilter"
class="filter"

>

<option value="all">
All Status
</option>

<option value="pending">
Pending
</option>

<option value="completed">
Completed
</option>

</select>

</div>

<div
id="tasksContainer"
class="tasks-container">
</div>

</div>

</main>

<div id="message"></div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

(function(){

"use strict";


const firebaseConfig={

apiKey:
"AIzaSyBBUN0is2Fq1KRJihVWeL2MMyi8yX4FAyg",

authDomain:
"dashboard-jadeed.firebaseapp.com",

databaseURL:
"https://dashboard-jadeed-default-rtdb.firebaseio.com",

projectId:
"dashboard-jadeed",

storageBucket:
"dashboard-jadeed.firebasestorage.app",

messagingSenderId:
"92287971638",

appId:
"1:92287971638:web:91b57c91032e7311864397"

};


firebase.initializeApp(firebaseConfig);


const db=
firebase.database();

const tasksRef=
db.ref("tasks");


let allTasks={};


/* ================= ELEMENTS ================= */

const taskNameInput=
document.getElementById("taskName");

const taskDescInput=
document.getElementById("taskDesc");

const taskAssigneeInput=
document.getElementById("taskAssignee");

const searchInput=
document.getElementById("searchInput");

const statusFilter=
document.getElementById("statusFilter");

const addButton=
document.getElementById("addTaskButton");

const tasksContainer=
document.getElementById("tasksContainer");


/* ================= ADD BUTTON ================= */

addButton.addEventListener(
"click",
addTask
);


/* ================= SEARCH ================= */

searchInput.addEventListener(
"input",
renderTasks
);


/* ================= FILTER ================= */

statusFilter.addEventListener(
"change",
renderTasks
);


/* ================= REAL TIME ================= */

tasksRef.on(
"value",
function(snapshot){

allTasks=
snapshot.val() || {};

updateStats();

renderTasks();

},
function(error){

showMessage(
"Firebase Error: "+error.message,
"error"
);

}
);


/* ================= ADD TASK ================= */

function addTask(){

const name=
taskNameInput.value.trim();

const desc=
taskDescInput.value.trim();

const assignee=
taskAssigneeInput.value.trim();


if(!name){

showMessage(
"Please enter a task name.",
"error"
);

return;
}


addButton.disabled=true;

addButton.textContent=
"Adding...";


tasksRef.push({

name:name,

desc:desc,

assignee:assignee,

comment:"",

completed:false,

createdAt:
firebase.database.ServerValue.TIMESTAMP

})
.then(function(){

taskNameInput.value="";
taskDescInput.value="";
taskAssigneeInput.value="";

showMessage(
"Task added successfully ✓",
"success"
);

})
.catch(function(error){

showMessage(
"Could not add task: "+
error.message,
"error"
);

})
.finally(function(){

addButton.disabled=false;

addButton.textContent=
"＋ Add Task";

});

}


/* ================= RENDER ================= */

function renderTasks(){

tasksContainer.innerHTML="";


const search=
searchInput.value
.toLowerCase()
.trim();


const filter=
statusFilter.value;


const entries=
Object.entries(allTasks)
.sort(function(a,b){

return
(b[1].createdAt || 0) -
(a[1].createdAt || 0);

});


let visible=0;


entries.forEach(function(item){

const id=item[0];

const task=item[1] || {};

const completed=
task.completed === true;


const searchable=
(
String(task.name || "")+
" "+
String(task.desc || "")+
" "+
String(task.assignee || "")+
" "+
String(task.comment || "")
)
.toLowerCase();


if(
search &&
searchable.indexOf(search) === -1
){

return;

}


if(
filter === "pending" &&
completed
){

return;

}


if(
filter === "completed" &&
!completed
){

return;

}


visible++;


/* CARD */

const card=
document.createElement("div");

card.className=
"task-card "+
(
completed
?
"completed-card"
:
"pending-card"
);


/* TOP */

const top=
document.createElement("div");

top.className="task-top";


const name=
document.createElement("div");

name.className="task-name";

name.textContent=
task.name || "-";


const status=
document.createElement("span");

status.className=
completed
?
"status completed"
:
"status pending";

status.innerHTML=
'<span class="status-dot"></span> '+
(
completed
?
"Completed ✓"
:
"Pending ⏳"
);


top.appendChild(name);

top.appendChild(status);


/* INFO */

const info=
document.createElement("div");

info.className="task-info";


const descBox=
document.createElement("div");

descBox.className="info-box";


const descTitle=
document.createElement("div");

descTitle.className="info-title";

descTitle.textContent=
"Description";


const desc=
document.createElement("div");

desc.className="info-text";

desc.textContent=
task.desc || "No description";


descBox.appendChild(descTitle);

descBox.appendChild(desc);


const assigneeBox=
document.createElement("div");

assigneeBox.className="info-box";


const assigneeTitle=
document.createElement("div");

assigneeTitle.className="info-title";

assigneeTitle.textContent=
"Assignee";


const assignee=
document.createElement("div");

assignee.className="info-text";

assignee.textContent=
task.assignee || "Not assigned";


assigneeBox.appendChild(
assigneeTitle
);

assigneeBox.appendChild(
assignee
);


info.appendChild(descBox);

info.appendChild(assigneeBox);


/* COMMENT */

const commentArea=
document.createElement("div");

commentArea.className=
"comment-area";


const commentTitle=
document.createElement("div");

commentTitle.className=
"comment-title";

commentTitle.textContent=
"💬 Comment / Follow-up";


const comment=
document.createElement("textarea");

comment.className=
"comment-input";

comment.placeholder=
"Add a comment or follow-up...";

comment.value=
task.comment || "";


comment.addEventListener(
"change",
function(){

updateComment(
id,
comment.value
);

}
);


commentArea.appendChild(
commentTitle
);

commentArea.appendChild(
comment
);


/* ACTIONS */

const actions=
document.createElement("div");

actions.className=
"task-actions";


const done=
document.createElement("button");

done.type="button";

done.className=
"action-btn done-btn";

done.textContent=
completed
?
"↩ Move to Pending"
:
"✓ Complete";


done.addEventListener(
"click",
function(){

toggleStatus(
id,
completed
);

}
);


const commentBtn=
document.createElement("button");

commentBtn.type="button";

commentBtn.className=
"action-btn comment-btn";

commentBtn.textContent=
"💬 Add Comment";


commentBtn.addEventListener(
"click",
function(){

updateComment(
id,
comment.value
);

}
);


const deleteBtn=
document.createElement("button");

deleteBtn.type="button";

deleteBtn.className=
"action-btn delete-btn";

deleteBtn.textContent=
"🗑 Delete";


deleteBtn.addEventListener(
"click",
function(){

deleteTask(id);

}
);


actions.appendChild(done);

actions.appendChild(commentBtn);

actions.appendChild(deleteBtn);


/* BUILD */

card.appendChild(top);

card.appendChild(info);

card.appendChild(commentArea);

card.appendChild(actions);

tasksContainer.appendChild(card);

});


/* EMPTY */

if(visible===0){

const empty=
document.createElement("div");

empty.className="empty";

empty.innerHTML=
'<div class="empty-icon">📋</div>'+
'<h3>No tasks found</h3>'+
'<p>Add a new task or change your search/filter.</p>';

tasksContainer.appendChild(empty);

}

}


/* ================= STATS ================= */

function updateStats(){

const tasks=
Object.values(allTasks);


const total=
tasks.length;


const completed=
tasks.filter(
function(task){

return task.completed === true;

}
).length;


document.getElementById(
"totalTasks"
).textContent=
total;


document.getElementById(
"pendingTasks"
).textContent=
total-completed;


document.getElementById(
"completedTasks"
).textContent=
completed;

}


/* ================= STATUS ================= */

function toggleStatus(
id,
current
){

tasksRef
.child(id)
.update({

completed:
!current

})
.then(function(){

showMessage(

current
?
"Task moved to Pending"
:
"Task completed ✓",

"success"

);

})
.catch(function(error){

showMessage(
error.message,
"error"
);

});

}


/* ================= COMMENT ================= */

function updateComment(
id,
comment
){

tasksRef
.child(id)
.update({

comment:
comment

})
.then(function(){

showMessage(
"Comment saved ✓",
"success"
);

})
.catch(function(error){

showMessage(
error.message,
"error"
);

});

}


/* ================= DELETE ================= */

function deleteTask(id){

if(
!window.confirm(
"Are you sure you want to delete this task?"
)
){

return;

}


tasksRef
.child(id)
.remove()

.then(function(){

showMessage(
"Task deleted ✓",
"success"
);

})
.catch(function(error){

showMessage(
error.message,
"error"
);

});

}


/* ================= MESSAGE ================= */

function showMessage(
text,
type
